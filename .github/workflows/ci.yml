name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: validador
          POSTGRES_PASSWORD: validador
          POSTGRES_DB: validador
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U validador -d validador"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      VOSC_DATABASE_URL: postgresql+psycopg://validador:validador@localhost:5432/validador
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
      - run: docker build -t validador-osc:ci .
