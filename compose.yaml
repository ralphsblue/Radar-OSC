name: validador-osc

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: validador
      POSTGRES_PASSWORD: validador
      POSTGRES_DB: validador
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validador -d validador"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    profiles: ["completo"]
    build: .
    environment:
      VOSC_DATABASE_URL: postgresql+psycopg://validador:validador@db:5432/validador
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados-postgres:
