repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(fase0|tests/fixtures)/
      - id: trailing-whitespace
        exclude: ^(fase0|tests/fixtures)/
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^(fase0|tests/fixtures)/
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types_or: [python, pyi]
